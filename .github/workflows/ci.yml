name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and self-check
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build app targets
        run: |
          swift build --product QuotaBar
          swift build --product QuotaBarPreview

      - name: Run core self-checks
        run: swift run QuotaBarChecks

      - name: Check shell scripts and diff
        run: |
          bash -n Scripts/package-app.sh
          bash -n Scripts/install.sh
          bash -n Scripts/install-release.sh
          git diff --check
